# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# gradle/gradle-daemon-jvm.properties asks for a Java 21 daemon. Point Gradle at the JDK 21 that
# ships with Android Studio so it resolves locally instead of downloading a toolchain from foojay.
org.gradle.java.installations.paths=C:\\Program Files\\Android\\Android Studio\\jbr

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP 2.0.x registers its generated sources through the `kotlin.sourceSets` DSL, which AGP 9's
# built-in Kotlin support rejects by default. This flag is the escape hatch AGP itself points at;
# it can be dropped once KSP registers generated sources via `android.sourceSets`.
android.disallowKotlinSourceSets=false
